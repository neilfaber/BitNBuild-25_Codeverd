<!DOCTYPE html>
<html>
<head>
  <title>Get Tax Record</title>
</head>
<body>
  <h2>Fetch Tax Record</h2>
  <form method="post">
    {% csrf_token %}
    <label>Record ID:</label><br>
    <input type="number" name="record_id" required><br><br>
    <button type="submit">Fetch Record</button>
  </form>

  {% if record %}
    <h3>📄 Record Found</h3>
    <p>User ID: {{ record.user_id }}</p>
    <p>Details: {{ record.details }}</p>
    <p>Timestamp: {{ record.timestamp }}</p>
  {% endif %}
</body>
</html>
