<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Record</title>
</head>
<body>
  <h1>Add Tax Record to Blockchain</h1>

  {% if message %}
    <p style="color: green;">{{ message }}</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label for="taxpayer">Taxpayer:</label>
    <input type="text" name="taxpayer" id="taxpayer" required><br><br>

    <label for="amount">Details:</label>
    <input type="text" name="amount" id="amount" required><br><br>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
