<!DOCTYPE html>
<html>
<head>
    <title>TaxWise Auto-Upload</title>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        
        .status {
            padding: 5px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        
        .status.connected {
            background-color: #dff0d8;
            color: #3c763d;
        }
        
        .status.disconnected {
            background-color: #f2dede;
            color: #a94442;
        }
        
        .stat-box {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        
        .button {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        
        .button:hover {
            background-color: #45a049;
        }
        
        .settings {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h2>TaxWise Statement Uploader</h2>
    
    <div id="connectionStatus" class="status">
        Checking connection...
    </div>
    
    <div class="stat-box">
        <p>Processed documents: <span id="processedCount">0</span></p>
        <p>Categorized items: <span id="categorizedCount">0</span></p>
    </div>
    
    <div class="settings">
        <label>
            <input type="checkbox" id="autoUpload" checked>
            Enable auto-upload
        </label>
    </div>
    
    <a href="http://localhost:8000/auth/login" target="_blank" class="button" id="loginButton">
        Open TaxWise Dashboard
    </a>
    
    <script src="popup.js"></script>
</body>
</html>
