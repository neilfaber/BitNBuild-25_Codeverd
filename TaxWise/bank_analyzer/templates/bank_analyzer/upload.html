<!DOCTYPE html>
<html>
<head>
    <title>Upload PDF - Transaction Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; text-align: center; padding: 50px; }
        .upload-box { background: white; padding: 40px; border-radius: 10px; width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="upload-box">
        <h2>Upload Your Bank/Credit Card Statement</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="pdf" accept="application/pdf" required><br>
            <button type="submit">Analyze PDF</button>
        </form>
    </div>
</body>
</html>
